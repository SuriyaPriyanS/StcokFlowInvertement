version: "3.8"

services:
  mongodb:
    image: mongo:6
    container_name: stockflow-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: stockflow-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: stockflow-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/stockflow
      - JWT_SECRET=supersecretstockflowkey123!
      - REDIS_URL=redis://redis:6379
      - SMTP_HOST=sandbox.smtp.mailtrap.io
      - SMTP_PORT=2525
      - SMTP_USER=mockuser
      - SMTP_PASS=mockpass
      - EMAIL_FROM=alerts@stockflow.com
      - STRIPE_SECRET_KEY=sk_test_mockkey12345

  frontend:
    build: ./frontend
    container_name: stockflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
